<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Generador Pokémon Aleatorio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      body {
        background-color: #f0f4f8;
        background-image: radial-gradient(#d1d9e6 2px, transparent 2px);
        background-size: 30px 30px;
      }
      h1 {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .btn-cry {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #1a6fc4;
        border: none;
        border-radius: 50px;
        padding: 10px 24px;
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        margin: 0 auto;
      }
      .btn-cry:hover {
        background: #1559a0;
        transform: scale(1.05);
      }
      .btn-cry__icon {
        font-size: 2rem;
      }
      .btn-cry__bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 24px;
      }
      .btn-cry__bars span {
        display: block;
        width: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.5);
        height: 6px;
        transition: height 0.2s;
      }
      /* Animación cuando está reproduciendo */
      .btn-cry.playing .btn-cry__bars span:nth-child(1) {
        animation: bar 0.8s ease-in-out infinite;
      }
      .btn-cry.playing .btn-cry__bars span:nth-child(2) {
        animation: bar 0.8s ease-in-out infinite 0.15s;
      }
      .btn-cry.playing .btn-cry__bars span:nth-child(3) {
        animation: bar 0.8s ease-in-out infinite 0.3s;
      }
      .btn-cry.playing .btn-cry__bars span:nth-child(4) {
        animation: bar 0.8s ease-in-out infinite 0.45s;
      }
      .btn-cry.playing .btn-cry__bars span:nth-child(5) {
        animation: bar 0.8s ease-in-out infinite 0.6s;
      }

      @keyframes bar {
        0%,
        100% {
          height: 6px;
        }
        50% {
          height: 22px;
          background: white;
        }
      }
      .pokeball-card {
        max-width: 450px;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        border: 4px solid #111;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .card-top {
        background-color: #e3000f;
        padding: 30px 20px;
        position: relative;
      }
      .card-divider {
        height: 16px;
        background-color: #111;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-divider::before {
        content: "";
        width: 36px;
        height: 36px;
        background: white;
        border-radius: 50%;
        border: 4px solid #111;
        position: absolute;
        z-index: 1;
        box-shadow: inset 0 0 0 8px #ccc;
      }
      .card-bottom {
        background-color: #f8f9fa;
        padding: 40px 20px 30px;
      }
      .pokemon-number {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pokemon-name {
        font-size: 2rem;
        font-weight: 800;
        color: white;
        text-transform: capitalize;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .badge-nivel {
        font-size: 1rem;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: 700;
        display: inline-block;
      }
      .btn-generar {
        background-color: #e3000f;
        border: none;
        color: white;
        font-weight: 700;
        padding: 12px 32px;
        border-radius: 50px;
        font-size: 1.1rem;
        box-shadow: 0 4px 12px rgba(227, 0, 15, 0.4);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn-generar:hover {
        background-color: #c0000d;
        color: white;
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(227, 0, 15, 0.5);
      }
      .pokeball-bg {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.1);
        top: -60px;
        right: -40px;
      }
      .pokemon-img {
        width: 120px;
        height: 120px;
        image-rendering: pixelated;
        filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
      }

      .pokemon-stats {
        text-align: left;
        padding: 0 8px;
      }

      .stat-bar-bg {
        background: #e0e0e0;
        border-radius: 4px;
        height: 10px;
        overflow: hidden;
      }
      .stat-bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.4s ease;
      }
    </style>
  </head>

  <body
    class="d-flex flex-column align-items-center justify-content-center min-vh-100"
  >
    <div id="app" class="text-center w-100 px-3">
      <h1 class="mb-4 fw-bold">
        <span class="badge bg-danger text-white">Poke-Randomizer</span>
      </h1>

      <p v-if="cargandoCache" class="text-muted">⏳ Cargando Pokédex...</p>
      <button
        class="btn btn-generar mb-4"
        @click="generarRandom"
        :disabled="cargandoCache"
      >
        Escanea la zona por un pokémon.
      </button>

      <!-- Filtro de generación -->
      <div class="d-flex justify-content-center gap-2 mb-4">
        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 1 && genSeleccionada.max === 151 }"
          @click="genSeleccionada = { min: 1, max: 151 }"
        >
          Gen I
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 152 && genSeleccionada.max === 251 }"
          @click="genSeleccionada = { min: 152, max: 251 }"
        >
          Gen II
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 252 && genSeleccionada.max === 386 }"
          @click="genSeleccionada = { min: 252, max: 386 }"
        >
          Gen III
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 387 && genSeleccionada.max === 493 }"
          @click="genSeleccionada = { min: 387, max: 493 }"
        >
          Gen IV
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 494 && genSeleccionada.max === 649 }"
          @click="genSeleccionada = { min: 494, max: 649 }"
        >
          Gen V
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 650 && genSeleccionada.max === 721 }"
          @click="genSeleccionada = { min: 650, max: 721 }"
        >
          Gen VI
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 722 && genSeleccionada.max === 809 }"
          @click="genSeleccionada = { min: 722, max: 809 }"
        >
          Gen VII
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 810 && genSeleccionada.max === 905 }"
          @click="genSeleccionada = { min: 810, max: 905 }"
        >
          Gen VIII
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 906 && genSeleccionada.max === 1025 }"
          @click="genSeleccionada = { min: 906, max: 1025 }"
        >
          Gen IX
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          :class="{ active: genSeleccionada.min === 1 && genSeleccionada.max === 1025 }"
          @click="genSeleccionada = { min: 1, max: 1025 }"
        >
          Todas
        </button>
      </div>

      <!-- Card Pokéball -->
      <div v-if="numero !== null" class="pokeball-card">
        <!-- Mitad roja -->
        <div class="card-top d-flex align-items-center justify-content-between">
          <div class="pokeball-bg"></div>
          <div class="text-start">
            <p class="pokemon-number mb-1">
              # {{ String(numero).padStart(3, '0') }}
            </p>
            <p class="pokemon-name mb-0">{{ nombrePokemon }}</p>
          </div>
          <!-- Imagen del Pokémon -->
          <span>
            <img :src="pokemonPNG" :alt="nombrePokemon" class="pokemon-img" />
          </span>
        </div>

        <!-- Franja negra con botón central -->
        <div class="card-divider"></div>

        <!-- Mitad blanca -->
        <div class="card-bottom">
          <!-- Reemplaza el <audio> actual -->
          <audio ref="audioCry" :src="pokemonCry"></audio>
          <button
            v-if="pokemonCry"
            class="btn-cry mt-3"
            @click="reproducirCry"
            :class="{ playing: reproduciendo }"
          >
            <span class="btn-cry__icon"><i class="bi bi-play-btn"></i></span>
            <span class="btn-cry__bars">
              <span></span><span></span><span></span><span></span><span></span>
            </span>
          </button>
          <hr />
          <table class="table table-borderless table-sm mt-3 mb-0">
            <tbody>
              <tr v-for="stat in pokemonStats" :key="stat.stat.name">
                <td
                  class="text-end text-muted fw-semibold small"
                  style="width: 90px"
                >
                  {{ stat.stat.name }}:
                </td>
                <td class="fw-bold small" style="width: 36px">
                  {{ stat.base_stat }}
                </td>
                <td>
                  <div class="stat-bar-bg">
                    <div
                      class="stat-bar-fill"
                      :style="{
              width: (stat.base_stat / 150 * 100) + '%',
              background: stat.base_stat > 80 ? '#22e300' : stat.base_stat > 50 ? '#f5a623' : '#e3000f'
            }"
                    ></div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Placeholder antes de generar -->
      <div v-else class="text-muted mt-3">
        <p>Presiona el botón para descubrir un Pokémon 👆</p>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            numero: null,
            nombrePokemon: "",
            pokemonPNG: "",
            pokemonCache: {},
            pokemonCry: "",
            pokemonStats: [],
            reproduciendo: false,
            cargandoCache: false, // ← agrega esto
            genSeleccionada: { min: 1, max: 151 },
          };
        },

        async mounted() {
          // ← agrega esto
          await this.inicializarCache();
        },

        methods: {
          async inicializarCache() {
            const guardado = localStorage.getItem("pokemonCache");
            if (guardado) {
              this.pokemonCache = JSON.parse(guardado);
              return;
            }
            this.cargandoCache = true;
            const promesas = [];
            for (let i = 1; i <= 1025; i++) {
              promesas.push(
                fetch(`https://pokeapi.co/api/v2/pokemon/${i}`)
                  .then((r) => r.json())
                  .then((data) => {
                    this.pokemonCache[i] = {
                      nombre: data.name,
                      imagen: data.sprites.front_default,
                      cry: data.cries.latest,
                      stats: data.stats,
                    };
                  }),
              );
            }
            await Promise.all(promesas);
            localStorage.setItem(
              "pokemonCache",
              JSON.stringify(this.pokemonCache),
            );
            this.cargandoCache = false;
          },

          reproducirCry() {
            const audio = this.$refs.audioCry;
            audio.currentTime = 0;
            audio.volume = 0.3;
            audio.play();
            this.reproduciendo = true;
            audio.onended = () => {
              this.reproduciendo = false;
            };
          },

          async generarRandom() {
            const { min, max } = this.genSeleccionada;
            this.numero = Math.floor(Math.random() * (max - min + 1)) + min;
            await this.cargarNombrePokemon(this.numero);
          },

          async cargarNombrePokemon(id) {
            if (this.pokemonCache[id]) {
              this.nombrePokemon = this.pokemonCache[id].nombre;
              this.pokemonPNG = this.pokemonCache[id].imagen;
              this.pokemonCry = this.pokemonCache[id].cry;
              this.pokemonStats = this.pokemonCache[id].stats;
              return;
            }
            try {
              const response = await fetch(
                `https://pokeapi.co/api/v2/pokemon/${id}`,
              );
              const data = await response.json();
              this.pokemonStats = data.stats;
              this.nombrePokemon = data.name;
              this.pokemonPNG = data.sprites.front_default;
              this.pokemonCry = data.cries.latest;
              this.pokemonCache[id] = {
                nombre: data.name,
                imagen: data.sprites.front_default,
                cry: data.cries.latest || data.cries.legacy || "",
                stats: data.stats,
              };
            } catch (error) {
              this.nombrePokemon = `Pokémon ${id} (error de carga)`;
              this.pokemonPNG = "";
            }
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
