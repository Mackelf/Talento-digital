    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            numero: null,
            nombrePokemon: "",
            pokemonPNG: "",      // ✅ declarada en data()
            pokemonCache: {},
          };
        },
        methods: {
          async generarRandom() {
            this.numero = Math.floor(Math.random() * 150) + 1;
            await this.cargarNombrePokemon(this.numero);
          },
          async cargarNombrePokemon(id) {
            if (this.pokemonCache[id]) {
              this.nombrePokemon = this.pokemonCache[id].nombre;
              this.pokemonPNG   = this.pokemonCache[id].imagen;
              return;
            }
            try {
              const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
              const data = await response.json();
              this.nombrePokemon = data.name;
              this.pokemonPNG    = data.sprites.front_default;
              // ✅ Guardamos ambos valores en el cache
              this.pokemonCache[id] = {
                nombre: data.name,
                imagen: data.sprites.front_default
              };
            } catch (error) {
              this.nombrePokemon = `Pokémon ${id} (error de carga)`;
              this.pokemonPNG    = "";
            }
          },
        },
      }).mount("#app");
    </script>
